<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevenLabs TTS (မြန်မာ)</title>
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ElevenLabs TTS (မြန်မာ)</h2>

    <label for="textInput">ထုတ်လုပ်လိုသော စာသား:</label>
    <textarea id="textInput" placeholder="မြန်မာစာသားများကို ဤနေရာတွင် ရိုက်ထည့်ပါ..."></textarea>

    <button id="generateBtn" onclick="generateAudio()">အသံထုတ်လုပ်မည်</button>

    <div class="status" id="statusText">ElevenLabs ဖြင့် အသံဖန်တီးနေပါပြီ၊ ခဏစောင့်ပါ...</div>
    <audio id="audioPlayer" controls style="display: none;"></audio>
</div>

<script>
    async function generateAudio() {
        const text = document.getElementById('textInput').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const statusText = document.getElementById('statusText');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!text) {
            alert("ကျေးဇူးပြု၍ စာသားအနည်းဆုံး တစ်ခုခု ရိုက်ထည့်ပါ။");
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = "ထုတ်လုပ်နေသည်...";
        statusText.style.display = "block";
        statusText.innerText = "ElevenLabs ဖြင့် အသံဖန်တီးနေပါပြီ၊ ခဏစောင့်ပါ...";
        audioPlayer.style.display = "none";

        try {
            const backendUrl = "https://burmese-tts-api.vercel.app/generate-audio";

            // Voice ID လုံးဝမပို့တော့ဘဲ Backend ရဲ့ Default ကိုပဲ သုံးခိုင်းခြင်း
            const response = await fetch(backendUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text
                })
            });

            if (!response.ok) {
                const errorData = await response.text();
                throw new Error(errorData || "အသံဖိုင်ထုတ်လုပ်ရာတွင် အမှားအယွင်း ရှိသွားပါသည်။");
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.style.display = "block";
            audioPlayer.play();

            statusText.innerText = "အသံထုတ်လုပ်ခြင်း ပြီးမြောက်ပါပြီ။";
        } catch (error) {
            console.error("Error details:", error);
            alert("Error: " + error.message);
            statusText.innerText = "အမှားအယွင်း ဖြစ်ပေါ်သွားပါသည်။";
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = "အသံထုတ်လုပ်မည်";
        }
    }
</script>

</body>
</html>
